# 1. Define the User Service pool with a primary and backup
upstream user_service {
    # If this container fails once, mark it dead for 5 seconds
    server fastapi-primary:8000 max_fails=1 fail_timeout=5s;
    
    # The 'backup' flag means Nginx only sends traffic here if the primary is down
    server fastapi-backup:8000 backup;
}

# 2. Define the Inventory Service pool (Django)
upstream inventory_service {
    server django-service:8000;
}

server {
    listen 80;

    # 3. Route User requests to FastAPI
    location /api/users/ {
        proxy_pass http://user_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        
        # The failover trigger: If primary returns these errors or times out, switch to backup
        proxy_next_upstream error timeout http_500 http_502 http_503 http_504;
    }

    # 4. Route Inventory requests to Django
    location /api/inventory/ {
        proxy_pass http://inventory_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}